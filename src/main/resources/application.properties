spring.profiles.default=local-demo


spring.application.name=loan-module

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/loan_module}
spring.datasource.username=${DB_USERNAME:loan_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Optional self-hosted WhatsApp integration (Evolution API / Baileys)
app.whatsapp.enabled=${WHATSAPP_ENABLED:false}
app.whatsapp.base-url=${WHATSAPP_BASE_URL:http://localhost:8085}
app.whatsapp.instance=${WHATSAPP_INSTANCE:loandesk}
app.whatsapp.api-key=${WHATSAPP_API_KEY:}

# Loan document storage. Keep files outside the frontend static directory.
app.documents.storage-dir=${LOAN_DOCUMENT_STORAGE:./uploads/loan-documents}
app.documents.max-file-size-bytes=${LOAN_DOCUMENT_MAX_FILE_SIZE:10485760}
app.documents.max-files-per-loan=${LOAN_DOCUMENT_MAX_FILES:10}
spring.servlet.multipart.max-file-size=${SPRING_MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${SPRING_MULTIPART_MAX_REQUEST_SIZE:11MB}
